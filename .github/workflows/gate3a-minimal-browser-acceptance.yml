name: Gate 3A Minimal Interview Browser Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate3a-minimal-interview-browser-acceptance
  cancel-in-progress: false

jobs:
  validate-interview-browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out frozen Gate 3A candidate
        uses: actions/checkout@v4
        with:
          ref: 72b9efaa1d21d966e0e48515152d3fedaa71becc
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Install browser-test dependencies
        run: python -m pip install -r requirements-browser.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="72b9efaa1d21d966e0e48515152d3fedaa71becc"
          test "$actual" = "$expected" || {
            echo "Expected frozen Gate 3A SHA $expected but checked out $actual"
            exit 1
          }
          echo "Validated frozen Gate 3A SHA: $actual"

      - name: Run focused Gate 3A contract tests
        run: PYTHONPATH=. python -m unittest tests.browser_acceptance.test_minimal_contract

      - name: Run minimal interview browser acceptance
        env:
          BROWSER_ARTIFACT_DIR: browser-artifacts/gate3a
          SOURCE_COMMIT: 72b9efaa1d21d966e0e48515152d3fedaa71becc
          TESTED_BRANCH: enhancement/minimal-interview-browser-acceptance
        run: PYTHONPATH=. python -m src.browser_acceptance.minimal_runner

      - name: Verify PASS disposition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("browser-artifacts/gate3a/acceptance-report.json").read_text(encoding="utf-8"))
          assert report["overall_disposition"] == "PASS", report
          PY

      - name: Verify tracked repository files remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short --untracked-files=no)" || {
            echo "Tracked repository files changed during browser validation"
            exit 1
          }

      - name: Upload Gate 3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3a-minimal-browser-acceptance-evidence
          path: browser-artifacts/gate3a
          if-no-files-found: error
          retention-days: 30

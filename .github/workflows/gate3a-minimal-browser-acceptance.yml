name: PVE Mobile Sidebar Live Post-Merge Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/pve-mobile-sidebar-browser-acceptance-v2"

permissions:
  contents: read

concurrency:
  group: pve-live-mobile-sidebar-post-merge-acceptance
  cancel-in-progress: false

jobs:
  validate-live-mobile-sidebar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify authoritative main merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "4959fe2cf90b4493091b48acd307cb60eecf22b1"
      - name: Install Playwright
        run: python -m pip install playwright==1.54.0
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run live physical mobile sidebar acceptance
        env:
          BROWSER_ARTIFACT_DIR: browser-artifacts/live-mobile-sidebar
          SOURCE_COMMIT: 4959fe2cf90b4493091b48acd307cb60eecf22b1
          TARGET_URL: https://packaging-value-engineering-decision-intelligence.streamlit.app/
        run: PYTHONPATH=. python validation/mobile_sidebar_acceptance.py
      - name: Verify PASS disposition and deployed CSS fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("browser-artifacts/live-mobile-sidebar/acceptance-report.json").read_text(encoding="utf-8"))
          assert report["candidate_sha"] == "4959fe2cf90b4493091b48acd307cb60eecf22b1", report
          assert report["target_url"] == "https://packaging-value-engineering-decision-intelligence.streamlit.app/", report
          assert report["overall_disposition"] == "PASS", report
          width = report["narrow_sidebar"]["width"]
          assert 179 <= width <= 201, report
          assert report["narrow_sidebar"]["minWidth"] == "180px", report
          assert report["narrow_sidebar"]["maxWidth"] == "200px", report
          PY
      - name: Upload live mobile sidebar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pve-live-mobile-sidebar-post-merge-evidence
          path: browser-artifacts/live-mobile-sidebar
          if-no-files-found: error
          retention-days: 30

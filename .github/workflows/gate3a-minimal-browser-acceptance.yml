name: PVE Mobile Sidebar Exact-Candidate Browser Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/pve-mobile-sidebar-browser-acceptance"

permissions:
  contents: read

concurrency:
  group: pve-mobile-sidebar-browser-acceptance
  cancel-in-progress: false

jobs:
  validate-mobile-sidebar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out validation bridge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify candidate application is unchanged
        shell: bash
        run: |
          set -euo pipefail
          candidate="b52e4f68cec9efab6a72f65a46c3fb3be948dc22"
          git cat-file -e "$candidate^{commit}"
          git diff --exit-code "$candidate"..HEAD -- app.py tests/application/test_sidebar_navigation_config.py
          echo "Validated application/test identity against exact candidate: $candidate"

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright
        run: python -m pip install playwright==1.54.0

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run focused physical mobile sidebar acceptance
        env:
          BROWSER_ARTIFACT_DIR: browser-artifacts/mobile-sidebar
          SOURCE_COMMIT: b52e4f68cec9efab6a72f65a46c3fb3be948dc22
        run: PYTHONPATH=. python validation/mobile_sidebar_acceptance.py

      - name: Verify PASS disposition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("browser-artifacts/mobile-sidebar/acceptance-report.json").read_text(encoding="utf-8"))
          assert report["candidate_sha"] == "b52e4f68cec9efab6a72f65a46c3fb3be948dc22", report
          assert report["overall_disposition"] == "PASS", report
          width = report["narrow_sidebar"]["width"]
          assert 179 <= width <= 201, report
          PY

      - name: Verify candidate application files remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          candidate="b52e4f68cec9efab6a72f65a46c3fb3be948dc22"
          git diff --exit-code "$candidate"..HEAD -- app.py tests/application/test_sidebar_navigation_config.py
          test -z "$(git status --short --untracked-files=no)" || {
            echo "Tracked repository files changed during browser validation"
            exit 1
          }

      - name: Upload mobile sidebar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pve-mobile-sidebar-browser-evidence
          path: browser-artifacts/mobile-sidebar
          if-no-files-found: error
          retention-days: 30

name: PVE CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  validate-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify mandatory files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            PROJECT_STATUS.md
            BUILD_INSTRUCTIONS.md
            ACTIVITY_LOG.md
            BUILD_HISTORY.md
            CHANGELOG.md
            DECISION_LOG.md
            VERSION_MANIFEST.md
            RECOVERY_MANIFEST.md
            QUALITY_ASSURANCE_PROTOCOL.md
            requirements.txt
            app.py
            docs/MASTER_ARCHITECTURE.md
            docs/MASTER_BUILD_PLAN.md
            docs/INTERVIEW_DEMO_GUIDE.md
            docs/FINAL_RELEASE_CHECKLIST.md
            docs/qa/PVE-0.1_QA_REPORT.md
            docs/qa/PVE-0.2_QA_REPORT.md
            docs/qa/PVE-0.3_QA_REPORT.md
            docs/qa/PVE-0.4_QA_REPORT.md
            docs/qa/PVE-0.5_QA_REPORT.md
            docs/qa/PVE-0.6_QA_REPORT.md
            docs/qa/PVE-0.7_QA_REPORT.md
            integration/README.md
            integration/contracts/PVE_CONTRACT_V1_DRAFT.md
            integration/exports/.gitkeep
            integration/samples/.gitkeep
            data/schemas/canonical_data_model.json
            data/reference/allowed_values.json
            data/demo/corrugated_shipping_cases.json
            data/demo/invalid_examples.json
            src/__init__.py
            src/data_models/__init__.py
            src/data_models/validator.py
            src/cost_engine/__init__.py
            src/cost_engine/engine.py
            src/material_engine/__init__.py
            src/material_engine/engine.py
            src/technical_qualification/__init__.py
            src/technical_qualification/engine.py
            src/risk_engine/__init__.py
            src/risk_engine/engine.py
            src/scenario_engine/__init__.py
            src/scenario_engine/engine.py
            src/recommendation/__init__.py
            src/recommendation/engine.py
            src/exports/__init__.py
            src/exports/decision_package.py
            tests/README.md
            tests/data_validation/__init__.py
            tests/data_validation/test_validator.py
            tests/cost_engine/__init__.py
            tests/cost_engine/test_engine.py
            tests/material_engine/__init__.py
            tests/material_engine/test_engine.py
            tests/technical_qualification/__init__.py
            tests/technical_qualification/test_engine.py
            tests/risk_engine/__init__.py
            tests/risk_engine/test_engine.py
            tests/scenario_engine/__init__.py
            tests/scenario_engine/test_engine.py
            tests/recommendation/__init__.py
            tests/recommendation/test_engine.py
            tests/exports/__init__.py
            tests/exports/test_decision_package.py
            tests/release/__init__.py
            tests/release/test_end_to_end_release.py
          )
          for file in "${required[@]}"; do
            test -e "$file" || { echo "Missing: $file"; exit 1; }
          done
      - name: Validate JSON syntax
        run: |
          python -m json.tool data/schemas/canonical_data_model.json > /dev/null
          python -m json.tool data/reference/allowed_values.json > /dev/null
          python -m json.tool data/demo/corrugated_shipping_cases.json > /dev/null
          python -m json.tool data/demo/invalid_examples.json > /dev/null
      - name: Verify synthetic demo label
        run: |
          grep -q '"dataset_type": "synthetic_demo"' data/demo/corrugated_shipping_cases.json
      - name: Verify project separation statement
        run: grep -qi "separate" DECISION_LOG.md
      - name: Verify current build identity
        run: grep -q "PVE-0.7" PROJECT_STATUS.md
      - name: Verify integration contract is draft
        run: grep -qi "draft" integration/contracts/PVE_CONTRACT_V1_DRAFT.md
      - name: Verify release documentation
        run: |
          grep -q "## Quick Start" README.md
          grep -q "## Demo Flow" docs/INTERVIEW_DEMO_GUIDE.md
          grep -q "## Acceptance Criteria" docs/FINAL_RELEASE_CHECKLIST.md
      - name: Run all automated tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -v > unittest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== UNITTEST FAILURE SUMMARY ==="
            grep -E "^(ERROR|FAIL):|^FAILED \(|^Ran [0-9]+ tests|^FAILED$|^Traceback|^[A-Za-z0-9_\.]+ \(.*\) \.\.\. (ERROR|FAIL)" unittest.log || true
            echo "=== UNITTEST FAILURE TAIL ==="
            tail -n 160 unittest.log
            exit "$status"
          fi
          cat unittest.log

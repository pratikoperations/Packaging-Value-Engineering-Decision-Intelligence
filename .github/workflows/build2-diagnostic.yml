name: PVE Build 2 Diagnostic

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Run unittest diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -v > unittest.log 2>&1
          status=$?
          echo "$status" > unittest-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload unittest diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: build2-unittest-diagnostics
          path: |
            unittest.log
            unittest-status.txt
      - name: Enforce unittest result
        shell: bash
        run: |
          status=$(cat unittest-status.txt)
          if [ "$status" -ne 0 ]; then
            tail -n 160 unittest.log
            exit "$status"
          fi
          cat unittest.log
